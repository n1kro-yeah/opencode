name: ForgeCode Guard

on:
  push:
    branches: [forgecode-production, dev]
    paths:
      - "packages/forgecode-guard/**"
      - ".github/workflows/forgecode-guard.yml"
  pull_request:
    paths:
      - "packages/forgecode-guard/**"
      - ".github/workflows/forgecode-guard.yml"

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - name: Install dependencies
        run: bun install --no-save
      - name: Typecheck plugin
        run: bunx tsc -p packages/forgecode-guard/tsconfig.json --noEmit
